<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main class="device" id="device"><div class="statusbar"><span id="clock"></span></div><header class="topbar" id="topbar"></header><section class="screen" id="screen"></section><div class="system-nav"></div><div class="modal-layer" id="modalLayer" hidden></div></main><pre id="qa" style="color:white"></pre><script src="app.js"></script><script>window.NEXA_PLUGIN_CATALOGUE={records:[],families:[],categories:[],snapshots:[],recordCount:0,recordOccurrences:0};window.NEXA_ACTIVITY_STATUS_LIBRARY={statuses:[],count:0};</script><script src="catalogue-ui.js"></script><script src="integrations-ui.js"></script><script>
(async()=>{const out=[];const check=(n,v)=>out.push((v?'PASS ':'FAIL ')+n);try{
 nav('plugins');check('plugin directory screen renders',screen.querySelectorAll('.video-plugin-row').length>=50);check('curated plugin listings count',NEXA_VIDEO_PLUGIN_DIRECTORY.recordCount>=50);check('separate plus buttons render',screen.querySelectorAll('.video-plugin-add').length>=40);
 const plus=screen.querySelector('[data-action="toggleVideoPlugin"][data-plugin="Gmail"]');plus.click();check('plus adds app locally',prefs.videoPluginAdded.includes('Gmail'));check('plus does not navigate away',currentPage==='plugins');check('added icon changes to check mark',screen.querySelector('[data-plugin="Gmail"].video-plugin-add')?.textContent==='✓');
 prefs.activeVideoPlugin='Plugin Management';nav('videoPluginDetail');check('Plugin Management detail displays read/write actions',screen.innerText.includes('get app permissions')&&screen.innerText.includes('Uninstall app'));
 nav('pluginManagementSkill');check('Use skill switch visible',!!screen.querySelector('[data-toggle="pluginManagementSkillEnabled"]'));check('skill guidance sections render',screen.innerText.includes('Choose the right capability')&&screen.innerText.includes('Find and suggest plugins')&&screen.innerText.includes('Manage existing plugins'));
 nav('chat');handleAction('chatOptions');check('chat overflow menu contains nine actions',modalLayer.querySelectorAll('[data-action="videoChatMenuChoice"]').length===9);modalLayer.querySelector('[data-menu-action="pin"]').click();check('pin action updates local state',prefs.chatPinned===true);
 nav('findInChat');check('Find in chat page renders',!!screen.querySelector('#findChatInput'));
 nav('chatUploads');check('Uploaded files page renders',!!screen.querySelector('#chatUploadInput'));
 nav('videoInstalledApps');check('Installed apps screen lists Plugin Management',screen.innerText.includes('Plugin Management'));
 }catch(e){out.push('ERROR '+(e.stack||e.message));}document.querySelector('#qa').textContent=out.join('\n');document.body.dataset.result=out.every(x=>x.startsWith('PASS'))?'pass':'fail';})();
</script></body></html>
