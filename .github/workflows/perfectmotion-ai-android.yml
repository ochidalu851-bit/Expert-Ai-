name: PerfectMotion AI Android
# Build on the dedicated app branch; the default branch contains only the reusable workflow.

on:
  push:
    branches:
      - perfectmotion-ai
    paths:
      - "PerfectMotionAI/android/**"
      - "PerfectMotionAI/app/**"
      - "PerfectMotionAI/settings.gradle.kts"
      - "PerfectMotionAI/build.gradle.kts"
      - "PerfectMotionAI/gradle.properties"
      - ".github/workflows/perfectmotion-ai-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check AI server syntax
        working-directory: PerfectMotionAI/server
        run: npm run check

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: PerfectMotionAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfectMotionAI-debug-apk
          path: PerfectMotionAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
