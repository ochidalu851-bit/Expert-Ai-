name: Expert AI Railway migration Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-original-ui-and-build-apk.yml"
      - "package.json"
      - "capacitor.config.json"
      - "src/App.tsx"

permissions:
  contents: write

concurrency:
  group: expert-ai-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Expert AI
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify committed AppDeploy source assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/mobile-ui-pack/index.html
          test -s public/mobile-ui-pack/styles.css
          test -s public/mobile-ui-pack/app.js
          test -s public/mobile-ui-pack/plugin_catalogue.js
          test -s public/mobile-ui-pack/activity_status_library.json
          test -s public/mobile-ui-pack/activity-status-library.js
          test -s public/mobile-ui-pack/live-bridge.js
          test -s public/mobile-ui-pack/pack-live-features.js
          grep -q 'live-bridge.js' public/mobile-ui-pack/index.html
          ! test -e public/mobile-ui-pack/bootstrap.js
          echo "Original AppDeploy UI, catalogue, artwork and Railway bridge are committed in GitHub; no AppDeploy download is required."
      
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web shell with the Railway API origin
        env:
          VITE_EXPERT_API_ORIGIN: https://expert-ai-production-9e613662.up.railway.app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Set compatible Android SDK and fresh app identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          variables = Path("android/variables.gradle")
          if variables.exists():
              text = variables.read_text()
              text, count = re.subn(r"minSdkVersion\\s*=\\s*\\d+", "minSdkVersion = 23", text, count=1)
              if not count:
                  raise SystemExit("Could not locate minSdkVersion in android/variables.gradle")
              variables.write_text(text)
          app = Path("android/app/build.gradle")
          text = app.read_text()
          text, c1 = re.subn(r"versionCode\\s+\\d+", "versionCode 2", text, count=1)
          text, c2 = re.subn(r'versionName\\s+"[^"]+"', 'versionName "2.0.0"', text, count=1)
          if not c1 or not c2:
              raise SystemExit("Could not set Android versionCode/versionName")
          app.write_text(text)
          print("Application ID: ai.expertai.railway")
          print("Version: 2.0.0 (code 2); minimum SDK: 23")
          PY

      - name: Add Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          required = (
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.POST_NOTIFICATIONS",
          )
          insertion = "".join(
              f'    <uses-permission android:name="{permission}" />\\n'
              for permission in required
              if f'android:name="{permission}"' not in source
          )
          if "android.hardware.microphone" not in source:
              insertion += '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\\n'
          if insertion:
              source = source.replace("    <application", insertion + "    <application", 1)
          path.write_text(source)
          PY

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK package metadata and signature
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -n 3
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Report APK size
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          MB=$(awk "BEGIN { printf \"%.2f\", $BYTES / 1048576 }")
          mkdir -p build-output
          cp "$APK" build-output/Expert-AI.apk
          echo "size_mb=$MB" >> "$GITHUB_OUTPUT"
          {
            echo "## Expert AI Android APK"
            echo ""
            echo "- APK size: **${MB} MB**"
            echo "- Requested target: approximately 24 MB"
            echo "- Build type: installable debug APK"
          echo "- Android package: ai.expertai.railway"
          echo "- Minimum Android version: API 23 (Android 6.0)
"
            echo "- UI source: original AppDeploy mobile UI archive, extracted into the app build (no runtime ZIP loader)"
            echo "- API host: Railway"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expert-AI-Android-APK
          path: build-output/Expert-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: expert-ai-android-migrated-${{ github.run_number }}
          name: Expert AI Android migrated build ${{ github.run_number }}
          prerelease: true
          files: build-output/Expert-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
